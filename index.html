<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Ads</title>
</head>
<body>
  <button id="review-ads" type="button">Review Ads</button>
  <p id="message" role="status"></p>

  <script>
    const button = document.getElementById('review-ads');
    const message = document.getElementById('message');

    async function reviewAds() {
      const response = await fetch('https://jsonplaceholder.typicode.com/posts');

      if (!response.ok) {
        throw new Error(`Request failed with status ${response.status}`);
      }

      const creatives = await response.json();

      return creatives.map(({ id, title }) => {
        const status = id % 3 === 0
          ? 'rejected'
          : id % 2 === 0 ? 'approved' : 'pending';

        return {
          id,
          title: status === 'rejected' ? title.toUpperCase() : title,
          status,
        };
      });
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      message.textContent = 'Reviewing ads…';

      try {
        const reviewedAds = await reviewAds();
        console.log(reviewedAds);
        message.textContent = 'Review complete. See the console for results.';
      } catch (error) {
        console.error('Unable to review ads:', error);
        message.textContent = 'Unable to review ads. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
